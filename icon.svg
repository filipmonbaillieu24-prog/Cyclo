<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0f121d"/>
  <!-- Inner circular ring representing cycling wheel -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="24" stroke-dasharray="10, 15" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad)" stroke-width="16" />
  <!-- Logo Letter C -->
  <text x="256" y="325" font-family="'Outfit', 'Inter', sans-serif" font-size="200" font-weight="900" fill="url(#grad)" text-anchor="middle">C</text>
</svg>
